name: Fetch RCH CPG pages

on:
  schedule:
    - cron: "5 18 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download every guideline page
        run: |
          mkdir -p latest
          python3 -I fetch_rch.py latest
      - name: Commit the new page text
        run: |
          git config user.name "cpg-watch-bot"
          git config user.email "cpg-watch-bot@users.noreply.github.com"
          git add latest/bundle.json
          git commit -m "Page text $(date -u +%Y-%m-%d)" || echo "No change"
          git push
